<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Can I Vibecode It?">
  <style>
    .tile { fill: #0a0a0a; }
    .card-dim { fill: none; stroke: #4a4a4a; stroke-width: 1.3; }
    .card-focus { fill: none; stroke: #fafafa; stroke-width: 1.9; }
    .glyph { fill: none; stroke: #fafafa; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- the tile -->
  <rect class="tile" x="0" y="0" width="32" height="32" rx="7" />
  <!-- the cards either side of the one in focus -->
  <rect class="card-dim" x="5.4" y="11.4" width="6.2" height="11" rx="2.2" transform="rotate(-10 8.5 16.9)" />
  <rect class="card-dim" x="20.4" y="11.4" width="6.2" height="11" rx="2.2" transform="rotate(10 23.5 16.9)" />
  <!-- the card in focus -->
  <rect class="card-focus" x="11.4" y="9.4" width="9.2" height="15.2" rx="3" />
  <!-- a gamepad in the card -->
  <path class="glyph" d="M13.9 14.1h4.2v4.4h-4.2z" />
  <path class="glyph" d="M14.9 15.3h2.2M14.9 17.3h2.2" />
</svg>
